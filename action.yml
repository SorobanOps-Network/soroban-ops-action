name: 'Soroban-Ops Gas Profiler'
description: 'Automatically profiles Soroban smart contract resource metrics and reports deltas on Pull Requests.'
author: 'SorobanOps Network'
inputs:
  github-token:
    description: 'The GITHUB_TOKEN secret required to post markdown comments back to the PR.'
    required: true
  soroban-simulation-logs:
    description: 'Raw stdout logs captured from the Soroban CLI simulation invocation.'
    required: false
  json-report-path:
    description: 'File path where structured metrics JSON report should be exported.'
    required: false
    default: 'soroban-gas-report.json'
  max_cpu_increase_percent:
    description: 'Maximum allowable percentage increase in CPU Instructions before failing CI.'
    required: false
  max_mem_increase_percent:
    description: 'Maximum allowable percentage increase in Memory Bytes before failing CI.'
    required: false
outputs:
  report-json-path:
    description: 'The absolute file path of the generated JSON gas report artifact.'
runs:
  using: 'node20'
  main: 'dist/index.js'